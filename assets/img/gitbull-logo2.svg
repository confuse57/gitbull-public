<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1219"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dffa0"/>
      <stop offset="1" stop-color="#17c96a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#1c4a32" stroke-width="4"/>

  <!-- faint grid -->
  <g stroke="#0e2a1a" stroke-width="2" opacity="0.45">
    <line x1="0" y1="171" x2="512" y2="171"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
    <line x1="171" y1="0" x2="171" y2="512"/>
    <line x1="341" y1="0" x2="341" y2="512"/>
  </g>

  <!-- ===== BULL HEAD (bold, geometric, clearly a bull) ===== -->
  <g filter="url(#glow)">
    <!-- horns: sweeping up-and-out, gold -->
    <path d="M150 190
             C 120 150, 118 110, 138 96
             C 150 128, 168 152, 196 168 Z" fill="#f5b642"/>
    <path d="M362 190
             C 392 150, 394 110, 374 96
             C 362 128, 344 152, 316 168 Z" fill="#f5b642"/>

    <!-- ears -->
    <path d="M168 176 L150 205 L188 200 Z" fill="#17c96a"/>
    <path d="M344 176 L362 205 L324 200 Z" fill="#17c96a"/>

    <!-- main face: strong hexagon-ish bull head tapering to snout -->
    <path d="M256 168
             L328 186
             L344 250
             L318 316
             L256 348
             L194 316
             L168 250
             L184 186 Z"
          fill="url(#greenGrad)"/>

    <!-- snout plate -->
    <path d="M256 300 L300 314 L290 342 L256 352 L222 342 L212 314 Z" fill="#12a557"/>
  </g>

  <!-- eyes -->
  <g fill="#05070a">
    <path d="M206 236 L234 244 L228 264 L204 258 Z"/>
    <path d="M306 236 L278 244 L284 264 L308 258 Z"/>
  </g>
  <!-- eye glints -->
  <g fill="#3dffa0">
    <rect x="212" y="242" width="8" height="8" rx="2"/>
    <rect x="292" y="242" width="8" height="8" rx="2"/>
  </g>

  <!-- nostrils, gold -->
  <g fill="#f5b642">
    <ellipse cx="240" cy="326" rx="7" ry="9"/>
    <ellipse cx="272" cy="326" rx="7" ry="9"/>
  </g>

  <!-- ===== candlestick / up-arrow accent (subtle, bottom) ===== -->
  <g filter="url(#glow)">
    <rect x="248" y="392" width="16" height="46" rx="3" fill="#22e07a"/>
    <path d="M256 372 L276 396 L236 396 Z" fill="#f5b642"/>
  </g>
</svg>
